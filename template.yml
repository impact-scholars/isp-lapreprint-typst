jtex: v1
kind: typst
title: ISP LaPreprint Typst Template
description: Impact Scholars Program preprint template, based on LaPreprint
template: template.typ
files:
  - lapreprint.typ
  - frontmatter.typ
  - template.typ
  - logo-watermark.svg
  - GitHub_Invertocat_Black.svg
  - yt_icon_almostblack_digital.png
  - LICENSE
authors:
  - name: Rowan Cockett
    github: rowanc1
    affiliations:
      - Curvenote
  - name: Franklin Koch
    github: fwkoch
    affiliations:
      - Curvenote
  - name: Paolo Marzolo
    github: pollomarzo
    affiliations:
      - Neuromatch
version: 0.1.0-isp
license: MIT
tags:
  - preprint
  - article
  - paper
thumbnail: ./examples/pixels/files/screenshot.png
github: https://github.com/impact-scholars/isp-lapreprint-typst
doc:
  - id: title
    required: true
  - id: authors
    required: true
  - id: subtitle
  - id: short_title
  - id: open_access
  - id: keywords
  - id: doi
  - id: github
  - id: venue
  - id: abbreviations
options:
  - id: logo
    type: file
    description: An image path that is shown in the top right of the page
  - id: kind
    type: string
    description: The "kind" of the content, e.g. "Original Research" - shown as the title of the margin content on the first page
  - id: youtube
    type: string
    description: URL to the seminar recording on YouTube, shown in the first-page sidebar
  - id: short_citation
    type: string
    description: |
      The short citation used in the document header. By default, it
      is automatically determined from the author names.
  - id: heading_numbering
    type: string
    description: |
      Heading numbering style.
      See also https://typst.app/docs/reference/model/numbering/.
  - id: full_width_body
    type: boolean
    default: true
    description: |
      When true (default), page 1 is a cover with the wide left margin and the
      body restarts full-width on a new page. Set false to keep the wide left
      margin throughout and flow the body continuously (no cover page break).
  - id: breakable_figures
    type: boolean
    default: false
    description: |
      When true, figures (and their captions) may break across pages instead of
      being forced into a single block. Escape hatch for very large content such
      as supplementary tables. Default false keeps figures together.
  - id: theme
    type: string
    description: |
      Allows to set the colortheme, e.g. red.darken(30%).
      Default set to rgb("#45429C").
  - id: render_abbreviations
    type: boolean
    default: false
    description: |
      Automatically render the abbreviations list after keywords.
      Set to true to enable auto-placement; leave false to place it manually
      in the document body (#place-abbreviations()) or omit it entirely.
      

parts:
  - id: abstract
    description: >
      An abstract is a short summary of your research paper or report. A good
      abstract will prepare readers for the detailed information to follow,
      communicate the essence of the article and help readers take away and remember key points.
    max_words: 500
    required: true
  - id: summary
    description: Plain language summary
    max_words: 500
    required: false
  - id: acknowledgements
    description: >
      Acknowledgements printed in the margin
    max_words: 500
  - id: availability
    description: >
      Data availability statement printed in the margin
    max_words: 500
